# QML-IDR Configuration File

# Project settings
project:
  name: "QML-IDR-RuBisCO"
  version: "1.0.0"
  description: "Quantum vs Classical ML for RuBisCO IDR Prediction"
  
# Data settings
data:
  pdbbind:
    version: "2020"
    url: "http://www.pdbbind.org.cn/download/"
    refined_subset: true
    max_resolution: 2.5
    
  rubisco_pdbs:
    - "8RUC"  # spinach RuBisCO large subunit with C-terminal IDR
    - "1RCX"  # cyanobacterial RuBisCO
    - "1AAI"  # tobacco RuBisCO
    - "3RBR"  # algal RuBisCO variant
    
  idr_settings:
    disorder_threshold: 0.5
    min_fragment_length: 10
    max_fragment_length: 15
    max_resolution: 2.0
    
  preprocessing:
    coordinate_normalization: true
    energy_minimization_steps: 1000
    energy_tolerance: 0.01  # kJ/mol
    
# Classical ML settings
classical:
  alphafold3:
    num_ensemble: 1
    num_recycles: 3
    early_stop_tolerance: 0.5
    confidence_threshold: 50  # pLDDT
    
  molecular_dynamics:
    simulation_time: 10  # ns
    force_field: "amber"
    water_model: "tip3p"
    
# Quantum ML settings
quantum:
  simulator:
    backend: "aer_simulator"
    shots: 1024
    max_qubits: 30
    
  vqe:
    ansatz_depth: 3
    optimizer: "COBYLA"
    max_iterations: 500
    convergence_tolerance: 1e-4
    
  noise:
    enable_noise: true
    error_rates: [0.01, 0.03, 0.05]  # 1%, 3%, 5%
    depolarizing_prob: 0.01
    
  hamiltonian:
    interaction_cutoff: 5.0  # Angstroms
    stress_perturbation: 0.1  # 10% for climate simulation
    
# Evaluation settings
evaluation:
  metrics:
    rmsd_threshold: 3.0  # Angstroms
    rg_variance_threshold: 1.0  # Angstroms
    energy_threshold: -100  # kcal/mol
    tm_score_threshold: 0.5
    gdt_ts_threshold: 50
    
  validation:
    train_test_split: 0.8
    cross_validation_folds: 5
    statistical_significance: 0.05
    
  ensemble_size: 5
  
# Computational settings
compute:
  n_jobs: -1  # Use all available cores
  memory_limit: "16GB"
  gpu_enabled: true
  
# Output settings
output:
  results_dir: "results"
  data_dir: "data"
  figures_dir: "results/figures"
  models_dir: "results/models"
  
# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/qml_idr.log"